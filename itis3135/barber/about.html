<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About – University No Money Barber</title>
  <link rel="stylesheet" href="styles/site.css">
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
  <style>
    #about-section { padding: 4rem 1.5rem; }
    .about-layout { max-width: 1100px; margin: 0 auto; }

    .about-intro-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 4rem;
      align-items: center;
      margin-bottom: 5rem;
    }

    .barber-photo-wrap { position: relative; }

    .barber-photo-wrap img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: var(--radius);
      border: 3px solid var(--blue);
      box-shadow: 0 16px 48px var(--blue-glow);
    }

    .barber-photo-wrap::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 12px;
      right: -12px;
      bottom: -12px;
      background: var(--blue);
      border-radius: var(--radius);
      z-index: -1;
      opacity: 0.15;
    }

    .about-bio h2 {
      font-size: 2.4rem;
      color: var(--text);
      margin-bottom: 0.4rem;
      font-weight: 900;
    }

    .about-bio h2 span { color: var(--blue); }

    .about-bio .role {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--blue);
      font-weight: 700;
      margin-bottom: 1.25rem;
      font-family: var(--font-display);
    }

    .about-bio p { color: var(--muted); margin-bottom: 1rem; }

    .values-strip {
      background: var(--blue);
      border-radius: var(--radius);
      padding: 2.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 2rem;
      text-align: center;
      margin-bottom: 5rem;
      box-shadow: 0 8px 32px var(--blue-glow);
    }

    .value-item h3 {
      font-size: 2rem;
      color: var(--white);
      font-weight: 900;
      margin-bottom: 0.25rem;
    }

    .value-item p {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.75);
      font-family: var(--font-display);
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-bottom: 4rem;
    }

    .why-card {
